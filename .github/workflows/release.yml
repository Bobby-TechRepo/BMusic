name: Release

# Push a tag such as v1.2.0 to build a signed release:
#   git tag v1.2.0 && git push origin v1.2.0
# The Play Store bundle (.aab), an installable APK and the R8 mapping file are attached to a
# GitHub release and kept as workflow artifacts.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   BMUSIC_KEYSTORE_BASE64   the release keystore, base64-encoded (base64 -w0 release.jks)
#   BMUSIC_KEYSTORE_PASSWORD
#   BMUSIC_KEY_ALIAS
#   BMUSIC_KEY_PASSWORD

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name, e.g. 1.2.0 (no release is published for manual runs)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Work out the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="${{ github.event.inputs.version }}"
          fi
          # Play needs a higher versionCode for every upload; the run number only ever grows.
          CODE=$(( 100 + ${{ github.run_number }} ))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building $NAME ($CODE)"

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.BMUSIC_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The BMUSIC_KEYSTORE_BASE64 secret is not set; a release must be signed."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "BMUSIC_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build signed bundle and APK
        env:
          BMUSIC_KEYSTORE_PASSWORD: ${{ secrets.BMUSIC_KEYSTORE_PASSWORD }}
          BMUSIC_KEY_ALIAS: ${{ secrets.BMUSIC_KEY_ALIAS }}
          BMUSIC_KEY_PASSWORD: ${{ secrets.BMUSIC_KEY_PASSWORD }}
        run: >
          ./gradlew :app:bundleRelease :app:assembleRelease --stacktrace
          -PversionName=${{ steps.version.outputs.name }}
          -PversionCode=${{ steps.version.outputs.code }}

      - name: Name the outputs
        run: |
          mkdir -p dist
          cp app/build/outputs/bundle/release/*.aab "dist/BMusic-${{ steps.version.outputs.name }}.aab"
          cp app/build/outputs/apk/release/*.apk "dist/BMusic-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/mapping/release/mapping.txt "dist/mapping-${{ steps.version.outputs.name }}.txt"

      - name: Keep the outputs
        uses: actions/upload-artifact@v4
        with:
          name: BMusic-${{ steps.version.outputs.name }}
          path: dist/

      - name: Publish a GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: BMusic ${{ steps.version.outputs.name }}
          body_path: fastlane/metadata/android/en-US/changelogs/default.txt
          files: |
            dist/BMusic-${{ steps.version.outputs.name }}.apk
            dist/BMusic-${{ steps.version.outputs.name }}.aab
            dist/mapping-${{ steps.version.outputs.name }}.txt
